<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick your bay | One More Round</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500;1,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #E2380B;
    --orange-deep: #C92F06;
    --paper: #F7F5F0;
    --ink: #141414;
    --muted: #5E5A55;
    --rule: #CFCAC2;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", "Helvetica Neue", Arial, sans-serif;
    --marker: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5;
    background-color: var(--orange);
    background-image:
      radial-gradient(rgba(120, 20, 0, .22) 1px, transparent 1.2px),
      radial-gradient(rgba(255, 140, 90, .12) 1px, transparent 1.2px);
    background-size: 5px 5px, 7px 7px;
    background-position: 0 0, 2px 3px;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 72px 20px 72px; }

  .masthead { text-align: center; color: #fff; margin-bottom: 26px; }
  .masthead h1 {
    margin: 0; font-family: var(--serif); font-style: italic; font-weight: 500;
    font-size: clamp(56px, 10vw, 112px); line-height: .86; letter-spacing: -0.02em; text-transform: uppercase;
  }
  .sponsor { margin: 10px 0 0; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; }

  .card {
    background: var(--paper); padding: 40px 34px 34px; transform: rotate(-0.4deg);
    box-shadow: 0 1px 0 rgba(0,0,0,.08);
  }
  .tag { margin: 0; font-family: var(--marker); color: var(--orange); font-size: 13px; text-transform: uppercase; letter-spacing: .02em; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
  .card-head h2 { margin: 2px 0 0; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: clamp(38px, 6vw, 58px); line-height: 1; }

  .hint { margin: 18px 0 24px; color: var(--muted); max-width: 60ch; }
  .status { margin: 0 0 18px; font-weight: 500; }
  .status.err { color: var(--orange-deep); }
  .status[hidden] { display: none; }

  .bays { display: grid; gap: 26px 22px; grid-template-columns: repeat(4, 1fr); }
  .bay { min-width: 0; padding: 4px; margin: -4px; border-radius: 2px; transition: background-color .15s; }
  .bay.over { background: rgba(226, 56, 11, .08); }
  .bay-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
  .bay-name { font-family: var(--serif); font-style: italic; font-size: 34px; line-height: 1; }
  .bay-name small { font-family: var(--marker); font-style: normal; font-size: 12px; color: var(--orange); margin-right: 6px; text-transform: uppercase; vertical-align: middle; }
  .bay.full .bay-name { color: var(--muted); }
  .count { font-size: 12px; color: var(--muted); }
  .slots { list-style: none; margin: 0; padding: 0; }
  .slots li { min-height: 34px; border-bottom: 1px dashed var(--rule); display: flex; align-items: center; }

  .chip { font-size: 14px; font-weight: 500; user-select: none; -webkit-user-select: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slots .chip { width: 100%; }
  .chip.movable { cursor: grab; touch-action: none; }
  .chip.dragging { opacity: .3; }
  button { font: inherit; color: inherit; }
  .bay-lock { margin-top: 10px; padding: 0 0 2px; border: 0; border-bottom: 2px solid var(--ink); background: none; font-weight: 500; font-size: 13px; cursor: pointer; }
  .bay-lock:hover { color: var(--orange); border-color: var(--orange); }
  .lock-tag { font-family: var(--marker); color: var(--orange); font-size: 11px; text-transform: uppercase; margin-right: 8px; }
  .bay.locked .bay-head { border-bottom-width: 2px; }
  .bay.locked .slots li { border-bottom-style: solid; border-bottom-color: var(--ink); }
  .chip.over { color: var(--orange); text-decoration: underline; text-underline-offset: 3px; }
  .ghost { position: fixed; z-index: 50; pointer-events: none; padding: 6px 12px; background: var(--orange); color: #fff;
    font-size: 14px; font-weight: 700; transform: translate(-50%, -120%) rotate(-2deg); box-shadow: 0 6px 18px rgba(0,0,0,.25); white-space: nowrap; }

  .pool[hidden] { display: none; }
  .pool { margin-top: 40px; padding-top: 20px; border-top: 2px solid var(--ink); }
  .pool h3 { margin: 2px 0 12px; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 30px; line-height: 1.1; }
  .pool-list { list-style: none; margin: 0; padding: 10px 0; display: flex; flex-wrap: wrap; gap: 6px; min-height: 52px; transition: background-color .15s; }
  .pool-list.over { background: rgba(226, 56, 11, .08); }
  .pool-list .chip { padding: 5px 10px; border: 1px solid var(--ink); background: #fff; }

  .admin { margin-top: 30px; padding-top: 16px; border-top: 1px dashed var(--rule); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
  .admin[hidden] { display: none; }
  .admin button { padding: 0 0 2px; border: 0; border-bottom: 2px solid var(--ink); background: none; font-weight: 500; cursor: pointer; }


  button:focus-visible, .chip:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

  @media (max-width: 820px) { .bays { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) {
    .wrap { padding-top: 48px; }
    .card { padding: 28px 18px 24px; transform: none; }
    .bays { grid-template-columns: repeat(2, 1fr); gap: 22px 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>One More<br>Round</h1>
    <p class="sponsor">Sponsored by Nike Golf</p>
  </header>

  <main class="card">
    <p class="tag">You're in</p>
    <div class="card-head">
      <h2>Pick your bay.</h2>
    </div>
    <p class="hint" id="poolHint">Everyone has a random bay. Want to play with friends? Drag your name onto someone in their bay to swap places. Happy with your group? Lock your bay so nobody can swap you out.</p>
    <p class="status" id="status" hidden></p>

    <section class="bays" id="bays" aria-label="Bays"></section>

    <section class="pool" id="poolSection">
      <p class="tag">Not placed yet</p>
      <h3>Not in a bay</h3>
      <ul class="pool-list" id="pool"></ul>
    </section>

    <section class="admin" id="admin" hidden>
      <span class="tag">Organiser</span>
      <button id="lockBtn">Lock bays</button>
      <button id="shuffleBtn">Shuffle everyone</button>
      <button id="resetBtn">Clear all bays</button>
    </section>
    <p id="info" hidden></p>
  </main>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  if (params.get('admin')) {
    try { localStorage.setItem('omr-admin', params.get('admin')); } catch {}
    history.replaceState(null, '', location.pathname);
  }
  let adminToken = '';
  try { adminToken = localStorage.getItem('omr-admin') || ''; } catch {}
  let isAdmin = false;
  let S = null;
  let dragging = null;
  let pending = null;
  let statusTimer;

  function status(text, err) {
    const el = $('status');
    el.textContent = text; el.className = 'status' + (err ? ' err' : ''); el.hidden = false;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { el.hidden = true; }, 4000);
  }

  async function api(url, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (adminToken) headers['x-admin-token'] = adminToken;
    const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Something went wrong. Try again.');
    return data;
  }

  const canMove = () => isAdmin || !(S && S.locked);

  async function setBayLock(bay, locked) {
    try {
      S = await api('/api/bay-lock', { bay, locked });
      render();
      status(locked ? `Bay ${bay} is locked.` : `Bay ${bay} is unlocked.`);
    } catch (e) { status(e.message, true); }
  }

  async function move(playerId, bay) {
    if ((S.assignments[playerId] || null) === bay) return;
    const from = S.assignments[playerId];
    if (!isAdmin && (isBayLocked(from) || isBayLocked(bay))) {
      status(`Bay ${isBayLocked(from) ? from : bay} is locked. Ask the organiser if you need to change it.`, true); return;
    }
    if (bay && Object.values(S.assignments).filter(x => x === bay).length >= S.perBay) {
      status(`Bay ${bay} is full. Drop your name on someone's name to swap places.`, true); return;
    }
    try {
      S = await api('/api/move', { playerId, bay });
      render();
      const p = S.players.find(x => x.id === playerId);
      status(bay ? `${p.name} is in bay ${bay}.` : `${p.name} is back on the list.`);
    } catch (e) { status(e.message, true); }
  }

  const isBayLocked = b => !!(b && S && (S.lockedBays || []).includes(b));

  async function swap(a, b) {
    const la = S.assignments[a], lb = S.assignments[b];
    if (!isAdmin && (isBayLocked(la) || isBayLocked(lb))) {
      status(`Bay ${isBayLocked(la) ? la : lb} is locked. Ask the organiser if you need to change it.`, true); return;
    }
    try {
      S = await api('/api/swap', { a, b });
      render();
      const n = id => S.players.find(x => x.id === id).name;
      status(`${n(a)} and ${n(b)} swapped places.`);
    } catch (e) { status(e.message, true); }
  }

  // Pointer-based drag: works with mouse and touch.
  function startDrag(e, p, el) {
    if (e.button !== undefined && e.button !== 0) return;
    pending = { p, el, x: e.clientX, y: e.clientY, id: e.pointerId };
  }
  function targetAt(x, y, selfId) {
    const hit = document.elementFromPoint(x, y);
    if (!hit) return null;
    const other = hit.closest('[data-swap]');
    if (other && other.dataset.swap !== selfId) return other;
    return hit.closest('[data-drop]');
  }
  let overEl = null;
  function setOver(el) {
    if (overEl === el) return;
    if (overEl) overEl.classList.remove('over');
    overEl = el; if (el) el.classList.add('over');
  }
  let scrollRaf = null, lastY = 0;
  function autoScroll() {
    const edge = 70, h = window.innerHeight;
    let dy = 0;
    if (lastY < edge) dy = -Math.ceil((edge - lastY) / 5);
    else if (lastY > h - edge) dy = Math.ceil((lastY - (h - edge)) / 5);
    if (dy) window.scrollBy(0, dy);
    scrollRaf = dragging ? requestAnimationFrame(autoScroll) : null;
  }
  window.addEventListener('pointermove', e => {
    if (pending && !dragging && e.pointerId === pending.id) {
      if (Math.hypot(e.clientX - pending.x, e.clientY - pending.y) < 6) return;
      const g = document.createElement('div');
      g.className = 'ghost'; g.textContent = pending.p.name;
      document.body.appendChild(g);
      pending.el.classList.add('dragging');
      dragging = { ...pending, ghost: g };
      pending = null;
      scrollRaf = requestAnimationFrame(autoScroll);
    }
    if (!dragging) return;
    e.preventDefault();
    lastY = e.clientY;
    dragging.ghost.style.left = e.clientX + 'px';
    dragging.ghost.style.top = e.clientY + 'px';
    setOver(targetAt(e.clientX, e.clientY, dragging.p.id));
  }, { passive: false });
  function endDrag(e, cancel) {
    pending = null;
    if (!dragging) return;
    const d = dragging; dragging = null;
    d.ghost.remove(); d.el.classList.remove('dragging');
    const t = cancel ? null : targetAt(e.clientX, e.clientY, d.p.id);
    setOver(null);
    if (t && t.dataset.swap) swap(d.p.id, t.dataset.swap);
    else if (t) move(d.p.id, t.dataset.drop === 'pool' ? null : Number(t.dataset.drop));
    else render();
  }
  window.addEventListener('pointerup', e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  function chip(p) {
    const li = document.createElement('li');
    li.className = 'chip';
    li.textContent = p.name;
    li.dataset.swap = p.id;
    if (canMove() && (isAdmin || !isBayLocked(S.assignments[p.id]))) {
      li.classList.add('movable');
      li.addEventListener('pointerdown', e => startDrag(e, p, li));
    }
    return li;
  }

  function render() {
    if (!S || dragging) return;
    const byBay = {};
    for (const p of S.players) {
      const b = S.assignments[p.id];
      (byBay[b || 0] = byBay[b || 0] || []).push(p);
    }

    const bays = $('bays'); bays.textContent = '';
    for (let b = 1; b <= S.bays; b++) {
      const list = byBay[b] || [];
      const full = list.length >= S.perBay;
      const art = document.createElement('article');
      const locked = isBayLocked(b);
      art.className = 'bay' + (full ? ' full' : '') + (locked ? ' locked' : '');
      art.dataset.drop = String(b);
      art.setAttribute('aria-label', `Bay ${b}, ${list.length} of ${S.perBay}`);
      art.innerHTML = `<div class="bay-head"><span class="bay-name"><small>Bay</small>${b}</span><span class="count">${locked ? '<span class="lock-tag">Locked</span>' : ''}${list.length}/${S.perBay}</span></div>`;
      const ul = document.createElement('ul'); ul.className = 'slots';
      list.forEach(p => ul.appendChild(chip(p)));
      for (let i = list.length; i < S.perBay; i++) ul.appendChild(document.createElement('li'));
      art.appendChild(ul);
      const showLock = !locked && list.length > 0 && (!S.locked || isAdmin);
      const showUnlock = locked && isAdmin;
      if (showLock || showUnlock) {
        const btn = document.createElement('button');
        btn.className = 'bay-lock';
        btn.textContent = locked ? 'Unlock bay' : 'Lock this bay';
        btn.addEventListener('click', () => {
          if (!locked) {
            const names = list.map(p => p.name).join(', ');
            if (!confirm(`Lock bay ${b} with ${names}? Nobody can move in or out after this. Only the organiser can unlock it.`)) return;
          }
          setBayLock(b, !locked);
        });
        art.appendChild(btn);
      }
      bays.appendChild(art);
    }

    const pool = $('pool'); pool.textContent = '';
    pool.dataset.drop = 'pool';
    (byBay[0] || []).forEach(p => pool.appendChild(chip(p)));
    $('poolSection').hidden = !(byBay[0] || []).length && !isAdmin;
    $('poolHint').textContent = S.locked && !isAdmin
      ? 'The bays are locked. Contact the organiser if you need to swap.'
      : 'Everyone has a random bay. Want to play with friends? Drag your name onto someone in their bay to swap places. Happy with your group? Lock your bay so nobody can swap you out.';

    $('admin').hidden = !isAdmin;
    $('lockBtn').textContent = S.locked ? 'Unlock bays' : 'Lock bays';
  }

  $('lockBtn').addEventListener('click', async () => {
    try { S = await api('/api/lock', { locked: !S.locked }); render(); status(S.locked ? 'Bays locked.' : 'Bays unlocked.'); }
    catch (e) { status(e.message, true); }
  });
  $('shuffleBtn').addEventListener('click', async () => {
    if (!confirm('Shuffle everyone into random bays? The current line-up is replaced.')) return;
    try { S = await api('/api/shuffle', {}); render(); status('Everyone shuffled into random bays.'); }
    catch (e) { status(e.message, true); }
  });
  $('resetBtn').addEventListener('click', async () => {
    if (!confirm('Clear all bays? Everyone goes back to the list.')) return;
    try { S = await api('/api/reset', {}); render(); status('All bays cleared.'); }
    catch (e) { status(e.message, true); }
  });

  async function init() {
    if (adminToken) {
      try {
        const r = await fetch('/api/admin-check', { headers: { 'x-admin-token': adminToken } });
        isAdmin = (await r.json()).admin;
        if (!isAdmin) { try { localStorage.removeItem('omr-admin'); } catch {} adminToken = ''; }
      } catch {}
    }
    S = await (await fetch('/api/state')).json();
    render();
    const es = new EventSource('/api/stream');
    es.onmessage = e => { S = JSON.parse(e.data); render(); };
  }
  init().catch(() => status('Could not load the bays. Refresh the page.', true));
})();
</script>
</body>
</html>
